<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>PONG</h1>
        <div class="scoreboard">
            <div class="score">
                <span class="label">Player</span>
                <span class="number" id="playerScore">0</span>
            </div>
            <div class="score">
                <span class="label">Computer</span>
                <span class="number" id="computerScore">0</span>
            </div>
        </div>
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        <div class="instructions">
            <p><strong>Controls:</strong> Use <strong>Mouse</strong> or <strong>Arrow Keys (Up/Down)</strong> to move the left paddle</p>
            <p><strong>Goal:</strong> Win by scoring 11 points!</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
